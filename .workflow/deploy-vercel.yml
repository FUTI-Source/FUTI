version: '1.0'
# Gitee Go 流水线：push 到 main 后把源码上传给 Vercel，由 Vercel 侧用 Turbopack 完成构建。
# 前置条件（只做一次）：
#   1. 仓库「服务 → Gitee Go」开通流水线（账号需绑定手机号）。
#   2. 在本流水线的「参数/变量」里新增 VERCEL_TOKEN（Vercel → Account Settings → Tokens），
#      建议勾选加密；切勿把 token 写进本文件的 variables 块，那会进 Git 历史。
#   3. Vercel 项目里配好 Environment Variables（见 README「部署到 Vercel」）。
name: deploy-vercel
displayName: Vercel 生产部署
triggers:
  # 代码推送后自动执行，不需要在控制台手动点「运行」
  trigger: auto
  push:
    branches:
      # 精确匹配，只有 main 分支的推送才发布生产环境
      precise:
        - main
stages:
  - name: stage-deploy-vercel
    displayName: 发布到 Vercel
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: deploy_vercel
        displayName: Vercel CLI 上传源码并部署
        # 这一步只负责跑 Vercel CLI，不编译项目，用当前最新 LTS 即可
        # （与 .nvmrc 一致；Vercel 侧的构建 Node 版本由 package.json engines 决定，见 README）
        nodeVersion: 26.13.1
        commands:
          - 'if [ -z "${VERCEL_TOKEN}" ]; then echo "缺少流水线变量 VERCEL_TOKEN，无法部署" >&2; exit 1; fi'
          # 不在 CI 里装依赖、不在 CI 里构建：源码压缩包上传后由 Vercel 跑 npm ci + next build，
          # 既省 Gitee Go 构建时长，也让 Vercel 控制台能看到完整构建日志。
          # 同名项目归属多个 Team 时，再加流水线变量 VERCEL_ORG_ID / VERCEL_PROJECT_ID，
          # Vercel CLI 直接读这两个环境变量，命令无需改动。
          - 'npx --yes vercel@latest deploy --prod --yes --token="${VERCEL_TOKEN}"'
        caches:
          - ~/.npm
        notify: []
        strategy:
          retry: '0'
