version: '1.0'
# Gitee Go 流水线：push 到 main 后把源码上传给 Vercel，由 Vercel 侧用 Turbopack 完成构建。
# 前置条件（只做一次）：
#   1. 开通 Gitee Go：仓库页顶部「流水线」标签（未开通会跳 /gitee_go/open），账号需绑定手机号。
#   2. 在本流水线的「参数设置」里定义 VERCEL_TOKEN（Vercel → Account Settings → Tokens，
#      Scope 选单个项目、并设过期时间）。可选 VERCEL_ORG_ID / VERCEL_PROJECT_ID。
#      ⚠️ Gitee Go **社区版没有「加密变量」**：官方《参数设置》只有系统级参数与流水线级参数，
#      《高级设置》只有阻塞构建与任务超时，没有任何加密/私密字段（加密仅企业版「凭证管理」有）。
#      参数值上限 256 字符（token 够用），要真正不落明文只能改用 GitHub Actions
#      或 Gitee Go 的 deploy@agent + 主机组，见 README「部署到 Vercel」。
#      切勿把 token 写进本文件的 variables 块，那会进 Git 历史；泄露后立刻在 Vercel 吊销。
#   3. Vercel 项目里配好 Environment Variables（见 README「部署到 Vercel」）。
name: deploy-vercel
displayName: Vercel 生产部署
triggers:
  # 代码推送后自动执行，不需要在控制台手动点「运行」
  trigger: auto
  push:
    branches:
      # 精确匹配，只有 main 分支的推送才发布生产环境
      precise:
        - main
stages:
  - name: stage-deploy-vercel
    displayName: 发布到 Vercel
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: deploy_vercel
        displayName: Vercel CLI 上传源码并部署
        # 这一步只负责跑 Vercel CLI，不编译项目，用当前最新 LTS 即可
        # （与 .nvmrc 一致；Vercel 侧的构建 Node 版本由 package.json engines 决定，见 README）
        nodeVersion: 26.13.1
        commands:
          - 'if [ -z "${VERCEL_TOKEN}" ]; then echo "缺少流水线变量 VERCEL_TOKEN，无法部署" >&2; exit 1; fi'
          # 只打印计数、不打印值：用于确认参数是「环境变量注入」还是「文本替换」。
          # 输出 1 → 真环境变量，命令行里看不到 token；输出 0 → Gitee Go 做的是文本替换，
          # token 必然出现在构建日志的命令行里，此时应改用 GitHub Actions 或主机组部署。
          - 'echo "VERCEL_TOKEN 已作为环境变量注入的数量：$(env | grep -c "^VERCEL_TOKEN=")"'
          # 不在 CI 里装依赖、不在 CI 里构建：源码压缩包上传后由 Vercel 跑 npm ci + next build，
          # 既省 Gitee Go 构建时长，也让 Vercel 控制台能看到完整构建日志。
          # 同名项目归属多个 Team 时，再加流水线变量 VERCEL_ORG_ID / VERCEL_PROJECT_ID，
          # Vercel CLI 直接读这两个环境变量，命令无需改动。
          # token 走环境变量而不是 --token=…：官方文档明确 --token 优先级高于 VERCEL_TOKEN，
          # 且命令行参数会出现在进程列表里，Vercel 建议用环境变量形式。
          - 'VERCEL_TOKEN="${VERCEL_TOKEN}" npx --yes vercel@latest deploy --prod --yes'
        caches:
          - ~/.npm
        notify: []
        strategy:
          retry: '0'
