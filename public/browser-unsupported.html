<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#15161a" />
    <meta name="color-scheme" content="dark" />
    <title>浏览器版本过低 · 张文涛</title>
    <!--
      浏览器版本过低提示页：纯静态 HTML，零 JS、零框架产物。

      被重定向到这里的浏览器内核过旧（且 360 等浏览器会伪造高版本 UA），
      任何 JS 都可能解析失败，因此页面必须完全不依赖脚本——
      站点入口的拦截链路见 site.config.ts「9.5 浏览器版本检查」与
      /scripts/browser-check.js。

      注意：下方「支持的最低版本」文案需与 site.config.ts 的
      SITE_BROWSER_MINIMUMS 保持一致（静态文件读不到该配置）。
    -->
    <style>
      /* 独立 HTML 拿不到主站的 CSS 变量，字体声明自带一份（与 offline.html 一致） */
      @font-face {
        font-family: 'Nunito Variable';
        font-style: normal;
        font-weight: 200 1000;
        font-display: swap;
        src: url('/fonts/nunito-latin-variable.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+2000-206F, U+20AC, U+2122, U+2190-21FF, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'ZCOOL KuaiLe';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/zcool-kuaile-sc.woff2') format('woff2');
        unicode-range: U+2E80-2FFF, U+3000-303F, U+3040-30FF, U+3400-4DBF, U+4E00-9FFF,
          U+F900-FAFF, U+FF00-FFEF;
      }
      :root {
        color-scheme: dark;
        background: #15161a;
        color: #f2f4f8;
        font-family: 'Nunito Variable', 'ZCOOL KuaiLe', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        text-align: center;
      }

      main {
        max-width: 36rem;
        padding: 2rem;
      }

      .icon {
        width: 3.5rem;
        height: 3.5rem;
        color: #0295e5;
      }

      h1 {
        margin: 1.25rem 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.9);
      }

      p {
        margin: 0;
        color: #a9afbc;
        line-height: 1.7;
      }

      .minimum {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.6rem 1.1rem;
        border-radius: 0.5rem;
        background: rgba(255, 255, 255, 0.05);
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.5);
      }

      .browsers {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      .browsers a {
        display: block;
        padding: 0.9rem 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.6rem;
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        transition: border-color 0.2s, background-color 0.2s, color 0.2s;
      }

      .browsers a:hover,
      .browsers a:focus-visible {
        border-color: rgba(2, 149, 229, 0.6);
        background: rgba(2, 149, 229, 0.1);
        color: #4db8f0;
      }

      .browsers .name {
        font-weight: 700;
        font-size: 0.9rem;
      }

      .browsers .note {
        margin-top: 0.25rem;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.5);
      }

      @media (min-width: 40rem) {
        .browsers {
          flex-direction: row;
        }
        .browsers a {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <path d="M2.5 9.5h19M2.5 14.5h19" />
        <path d="M12 2.5c2.7 2.5 4 6 4 9.5s-1.3 7-4 9.5c-2.7-2.5-4-6-4-9.5s1.3-7 4-9.5Z" />
      </svg>
      <h1>浏览器版本过低</h1>
      <p>
        您当前使用的浏览器版本过低，无法正常展示本站内容。<br />
        请升级浏览器，或更换以下现代浏览器后重新访问。
      </p>
      <p class="minimum">支持的最低版本：Chrome / Edge ≥ 125　·　Firefox ≥ 126　·　Safari ≥ 17.5</p>
      <div class="browsers">
        <a href="https://www.microsoft.com/zh-cn/edge/download" target="_blank" rel="noopener noreferrer">
          <span class="name">Microsoft Edge</span>
          <span class="note">Windows / macOS 均可使用</span>
        </a>
        <a href="https://www.google.com/chrome/" target="_blank" rel="noopener noreferrer">
          <span class="name">Google Chrome</span>
          <span class="note">Chromium 内核，功能最完整</span>
        </a>
        <a href="https://www.mozilla.org/zh-CN/firefox/" target="_blank" rel="noopener noreferrer">
          <span class="name">Firefox</span>
          <span class="note">独立内核，轻量安全</span>
        </a>
      </div>
    </main>
  </body>
</html>
