<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>邮件模板预览 · FUTI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px 48px;
    background: #15161a;
    color: #e8eaee;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  header { max-width: 1240px; margin: 0 auto 28px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  p.sub { margin: 8px 0 0; font-size: 13px; color: #8b919c; line-height: 1.6; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 24px;
    max-width: 1240px;
    margin: 0 auto;
  }
  .panel { min-width: 0; }
  .label {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 10px 2px;
    font-size: 13px;
    color: #aeb4bf;
  }
  .label span { font-size: 12px; color: #6f7783; }
  iframe {
    display: block;
    width: 100%;
    height: 760px;
    border: 1px solid #2a2d33;
    border-radius: 12px;
    background: #fff;
  }
</style>
</head>
<body>
<header>
  <h1>邮件模板预览</h1>
  <p class="sub">左：站长通知邮件 · 右：访客确认邮件。内容为样例数据，仅用于检查排版与移动端表现。</p>
</header>
<div class="grid">
  <section class="panel">
    <div class="label">站长通知 <span>收到一条新的留言</span></div>
    <iframe src="/mail-preview/owner.html" title="站长通知邮件" onload="fit(this)"></iframe>
  </section>
  <section class="panel">
    <div class="label">访客确认 <span>留言已送达</span></div>
    <iframe src="/mail-preview/confirm.html" title="访客确认邮件" onload="fit(this)"></iframe>
  </section>
</div>
<script>
  function fit(frame) {
    try {
      var doc = frame.contentWindow.document;
      var height = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
      frame.style.height = height + 'px';
    } catch (e) {}
  }
  window.addEventListener('resize', function () {
    document.querySelectorAll('iframe').forEach(fit);
  });
</script>
</body>
</html>
